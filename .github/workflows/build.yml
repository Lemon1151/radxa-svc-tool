name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build ARM64 release
        run: msbuild RadxaControlCenter.sln /m /p:Configuration=Release /p:Platform=ARM64

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RadxaControlCenter-ARM64
          path: bin/ARM64/Release/RadxaControlCenter.exe
          if-no-files-found: error
