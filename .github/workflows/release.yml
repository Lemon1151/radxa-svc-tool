name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build ARM64 release
        run: msbuild RadxaControlCenter.sln /m /p:Configuration=Release /p:Platform=ARM64

      - name: Package release
        shell: pwsh
        run: |
          $archive = "RadxaControlCenter-${{ github.ref_name }}-ARM64.zip"
          Compress-Archive -Path bin/ARM64/Release/RadxaControlCenter.exe, LICENSE -DestinationPath $archive
          "RELEASE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.RELEASE_ARCHIVE }}
